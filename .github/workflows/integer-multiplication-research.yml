name: Integer multiplication research evidence
on: [push, pull_request]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python experiments/circuit-replay/check_results.py
      - run: python experiments/kappa-refinement/check_results.py
      - run: python experiments/kappa-structural/check_results.py
