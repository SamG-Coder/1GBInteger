name: Evolution rule comparison
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sanitized rule harness and edge cases
        run: |
          g++ -O2 -std=c++17 -fsanitize=undefined -fno-sanitize-recover=all rule_compare.cpp -o rule_compare
          g++ -O2 -std=c++17 -fsanitize=undefined -fno-sanitize-recover=all test_rule_edges.cpp -o test_rule_edges
      - name: Independent transition, counter, graph and perturbation oracles
        run: python3 test_rule_comparison.py
      - name: Verify evidence and reproduce comparative reports
        run: python3 analyze_rule_comparison.py
